<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f5">
  <title>Mis tareas · WhatsApp</title>
  <link rel="stylesheet" href="/assets/bootstrap.min.css">
  <style>
    :root {
      --app-green: #15734c;
      --app-green-dark: #10583b;
      --app-muted: #68776e;
      --app-line: #e3eae5;
    }

    body {
      min-height: 100vh;
      background: #f4f7f5;
      color: #17241d;
    }

    .dashboard-shell {
      max-width: 1320px;
    }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      border-radius: 14px;
      background: var(--app-green);
      color: #fff;
    }

    .brand-mark svg {
      width: 24px;
      height: 24px;
    }

    .brand-caption,
    .text-muted-app {
      color: var(--app-muted);
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f0ad4e;
    }

    .connection.on .connection-dot {
      background: #198754;
      box-shadow: 0 0 0 3px rgb(25 135 84 / 14%);
    }

    .stat-card {
      min-height: 132px;
    }

    .stat-card-primary {
      border: 0;
      background: var(--app-green);
      color: #fff;
    }

    .stat-card-primary .text-muted-app {
      color: rgb(255 255 255 / 75%);
    }

    .filter.active {
      background: var(--app-green);
      border-color: var(--app-green);
      color: #fff;
    }

    .filter:not(.active) {
      border-color: var(--app-line);
      background: #fff;
      color: #45554b;
    }

    .filter:not(.active):hover {
      border-color: var(--app-green);
      color: var(--app-green-dark);
    }

    .task-list {
      margin: 0;
      padding: 0 1.25rem 1rem;
      list-style: none;
    }

    .task + .task {
      border-top: 1px solid var(--app-line);
    }

    .task-body {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .min-w-0 {
      min-width: 0;
    }

    .task-body a {
      color: var(--app-green-dark);
      text-underline-offset: 3px;
    }

    .task-note:empty {
      display: none;
    }

    .task.is-done .task-body {
      color: var(--app-muted);
    }

    .task.is-new {
      animation: task-highlight 3.5s ease-out;
    }

    @keyframes task-highlight {
      0%, 35% { background: #e6f4eb; }
      100% { background: transparent; }
    }

    .task-check {
      display: grid;
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      place-items: center;
      padding: 0;
    }

    .task-check svg {
      width: 20px;
      height: 20px;
      opacity: 0;
    }

    .task-check[aria-pressed="true"] {
      background: var(--app-green);
      color: #fff;
    }

    .task-check[aria-pressed="true"] svg {
      opacity: 1;
    }

    .task-check[hidden],
    .delete[hidden] {
      display: none !important;
    }

    .task-meta {
      color: var(--app-muted);
      font-size: .82rem;
    }

    .task-sender {
      color: #17241d;
      font-size: .95rem;
    }

    .task-id {
      color: #89968e;
    }

    .empty-icon {
      display: grid;
      width: 56px;
      height: 56px;
      place-items: center;
      margin: 0 auto 1rem;
      border-radius: 18px;
      background: #e6f4eb;
      color: var(--app-green);
    }

    .empty-icon svg {
      width: 26px;
      height: 26px;
    }

    .new-task-banner {
      z-index: 5;
      top: 1rem;
      left: 50%;
      width: min(520px, calc(100% - 2rem));
      transform: translateX(-50%);
      pointer-events: none;
    }

    .tv-hide[hidden] {
      display: none !important;
    }

    body.tv .dashboard-shell {
      max-width: 1800px;
    }

    body.tv .tv-hide {
      display: none !important;
    }

    body.tv .tv-stat {
      min-height: 100px;
    }

    body.tv .tv-stat .display-5 {
      font-size: 2rem;
    }

    body.tv .tv-task-list {
      max-height: calc(100vh - 360px);
      overflow-y: auto;
    }

    body.tv .task-body {
      font-size: clamp(1.15rem, 1.8vw, 1.65rem);
    }

    @media (max-width: 575.98px) {
      .task-list {
        padding-right: 1rem;
        padding-left: 1rem;
      }

      .stat-card {
        min-height: 110px;
      }

      body.tv .tv-task-list {
        max-height: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="container-fluid dashboard-shell px-3 px-lg-4 py-4 py-lg-5">
    <header class="tv-hide d-flex flex-wrap justify-content-between align-items-center gap-3">
      <div class="d-flex align-items-center gap-3">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-11.2 6.5L4 19l1.1-4.1A7.5 7.5 0 1 1 20 11.5Z"/><path d="m8.8 11.8 2 2 4.3-4.5"/></svg>
        </span>
        <div>
          <div class="fw-bold">Tareas</div>
        </div>
      </div>
      <div class="d-flex flex-wrap align-items-center justify-content-end gap-2">
        <div class="connection badge rounded-pill text-bg-light border d-inline-flex align-items-center gap-2 px-3 py-2" id="connection">
          <span class="connection-dot"></span>
          <span id="connection-label">Conectando</span>
        </div>
        <a class="btn btn-success btn-sm rounded-pill tv-hide" id="display-link" href="/?tv=1">Pantalla TV</a>
      </div>
    </header>

    <section class="tv-hide mt-5 mb-4">
      <h1 class="display-6 fw-bold mb-2">Tareas</h1>
    </section>

    <section class="row row-cols-1 row-cols-sm-3 g-3 mb-4 tv-summary" aria-label="Resumen de tareas">
      <div class="col">
        <article class="card stat-card tv-stat stat-card-primary shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-between">
            <span class="text-muted-app small fw-semibold">Por hacer</span>
            <strong class="display-5 fw-bold lh-1" id="pending-count">—</strong>
          </div>
        </article>
      </div>
      <div class="col">
        <article class="card stat-card tv-stat border-0 shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-between">
            <span class="text-muted-app small fw-semibold">Recibidas hoy</span>
            <strong class="display-5 fw-bold lh-1" id="today-count">—</strong>
          </div>
        </article>
      </div>
      <div class="col">
        <article class="card stat-card tv-stat border-0 shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-between">
            <span class="text-muted-app small fw-semibold">Completadas</span>
            <strong class="display-5 fw-bold lh-1" id="done-count">—</strong>
          </div>
        </article>
      </div>
    </section>

    <section class="card border-0 shadow-sm" aria-labelledby="list-title">
      <div class="card-body p-3 p-lg-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h2 class="h4 fw-bold mb-0" id="list-title">Bandeja de tareas</h2>
          <span class="small text-muted-app" id="result-count"></span>
        </div>
        <div class="row g-2 align-items-center mb-3 tv-hide">
          <div class="col-12 col-lg-auto">
            <div class="btn-group w-100" role="group" aria-label="Filtrar tareas">
              <button class="btn btn-sm filter active" type="button" data-status="pending" aria-pressed="true">Por hacer</button>
              <button class="btn btn-sm filter" type="button" data-status="done" aria-pressed="false">Hechas</button>
              <button class="btn btn-sm filter" type="button" data-status="all" aria-pressed="false">Todas</button>
            </div>
          </div>
          <div class="col">
            <label class="visually-hidden" for="search">Buscar tareas</label>
            <input class="form-control form-control-sm" id="search" type="search" placeholder="Buscar tarea o persona">
          </div>
          <div class="col-12 col-lg-auto">
            <button class="btn btn-outline-secondary btn-sm w-100" type="button" id="refresh" aria-label="Actualizar tareas" title="Actualizar">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4.5 16a8 8 0 0 0 13.7 2.2L20 16M4 12a8 8 0 0 1 13.7-5.8L20 8"/></svg>
              Actualizar
            </button>
          </div>
        </div>
        <div class="alert alert-danger py-2 mb-3 d-none" id="alert" role="alert"></div>
      </div>
      <ul class="task-list tv-task-list" id="task-list" aria-live="polite"></ul>
    </section>

    <p class="small text-center text-muted-app mt-3 mb-0">Los cambios se sincronizan automáticamente para todo el equipo.</p>
  </main>

  <div class="alert alert-success new-task-banner position-fixed shadow d-none" id="new-task-banner" role="status" aria-live="polite"></div>

  <template id="task-template">
    <li class="task d-flex align-items-start gap-3 py-3">
      <button class="task-check btn btn-outline-success rounded-circle" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg>
      </button>
      <div class="task-main flex-grow-1 min-w-0">
        <div class="task-meta d-flex flex-wrap align-items-center gap-2">
          <strong class="task-sender"></strong>
          <span class="task-id"></span>
          <time class="task-time"></time>
        </div>
        <p class="task-body mb-0 mt-2"></p>
        <p class="task-note small text-success mb-0 mt-2"></p>
      </div>
      <div class="task-actions d-flex align-items-center gap-2">
        <span class="badge rounded-pill text-bg-warning"></span>
        <button class="delete btn btn-outline-danger btn-sm" type="button">Eliminar</button>
      </div>
    </li>
  </template>

  <script>
    const state = {
      status: 'pending',
      tasks: [],
      counts: { pending: 0, done: 0, today: 0 },
      query: '',
      highlightId: null,
    };
    const $ = (id) => document.getElementById(id);
    const tvMode = new URLSearchParams(location.search).get('tv') === '1';
    document.body.classList.toggle('tv', tvMode);
    const timeFormat = new Intl.DateTimeFormat('es-ES', { dateStyle: 'medium', timeStyle: 'short' });
    const relativeFormat = new Intl.RelativeTimeFormat('es', { numeric: 'auto' });
    let bannerTimer = 0;

    function showIncomingTask(task) {
      state.highlightId = task.id;
      const sender = task.from_name || `+${task.from_number}`;
      $('new-task-banner').textContent = `Nueva tarea de ${sender}`;
      $('new-task-banner').classList.remove('d-none');
      window.clearTimeout(bannerTimer);
      bannerTimer = window.setTimeout(() => $('new-task-banner').classList.add('d-none'), 12000);
      if (tvMode) window.scrollTo({ top: 0, behavior: 'smooth' });
      loadTasks();
    }

    function ago(timestamp) {
      const seconds = Math.round((timestamp - Date.now()) / 1000);
      for (const [unit, size] of [['day', 86400], ['hour', 3600], ['minute', 60]]) {
        if (Math.abs(seconds) >= size) return relativeFormat.format(Math.round(seconds / size), unit);
      }
      return 'ahora mismo';
    }

    function safeLinks(element, text) {
      element.textContent = '';
      text.split(/(https?:\/\/[^\s]+)/g).forEach((part, index) => {
        if (index % 2 === 0) {
          element.append(document.createTextNode(part));
          return;
        }
        try {
          const url = new URL(part);
          if (!['http:', 'https:'].includes(url.protocol)) throw new Error('Unsupported URL protocol');
          const anchor = document.createElement('a');
          anchor.href = url.href;
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          anchor.textContent = part;
          element.append(anchor);
        } catch {
          element.append(document.createTextNode(part));
        }
      });
    }

    function render() {
      $('pending-count').textContent = state.counts.pending ?? 0;
      $('today-count').textContent = state.counts.today ?? 0;
      $('done-count').textContent = state.counts.done ?? 0;
      const query = state.query.toLocaleLowerCase('es');
      const items = state.tasks.filter((task) => !query
        || task.body.toLocaleLowerCase('es').includes(query)
        || (task.from_name || '').toLocaleLowerCase('es').includes(query)
        || task.from_number.includes(query));
      const highlightId = state.highlightId;
      state.highlightId = null;
      $('result-count').textContent = `${items.length} ${items.length === 1 ? 'tarea' : 'tareas'}`;
      const list = $('task-list');
      list.replaceChildren();
      if (items.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'text-center py-5';
        const icon = document.createElement('span');
        icon.className = 'empty-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4.5 4.5L19 7"/><circle cx="12" cy="12" r="10"/></svg>';
        const title = document.createElement('p');
        title.className = 'fw-semibold mb-1';
        title.textContent = state.query ? 'No encontramos coincidencias' : state.status === 'done' ? 'Aún no hay tareas hechas' : 'Todo al día';
        const copy = document.createElement('p');
        copy.className = 'text-muted-app small mb-0';
        copy.textContent = state.query ? 'Prueba con otra búsqueda.' : state.status === 'done' ? 'Cuando completes una tarea, aparecerá aquí.' : 'Las nuevas tareas de WhatsApp aparecerán aquí.';
        empty.append(icon, title, copy);
        list.append(empty);
        return;
      }

      for (const task of items) {
        const item = $('task-template').content.firstElementChild.cloneNode(true);
        item.classList.toggle('is-done', Boolean(task.done));
        item.classList.toggle('is-new', task.id === highlightId);
        const toggle = item.querySelector('.task-check');
        toggle.hidden = tvMode;
        toggle.setAttribute('aria-pressed', String(Boolean(task.done)));
        toggle.setAttribute('aria-label', task.done ? 'Volver a pendiente' : 'Marcar como hecha');
        toggle.title = task.done ? 'Volver a pendiente' : 'Marcar como hecha';
        toggle.addEventListener('click', () => {
          updateTask(task, !Boolean(task.done));
        });

        const sender = item.querySelector('.task-sender');
        sender.textContent = task.from_name || `+${task.from_number}`;
        sender.title = `+${task.from_number}`;
        item.querySelector('.task-id').textContent = `#${task.id}`;
        const received = item.querySelector('.task-time');
        received.textContent = ago(task.received_at);
        received.dateTime = new Date(task.received_at).toISOString();
        received.title = timeFormat.format(task.received_at);
        safeLinks(item.querySelector('.task-body'), task.body);

        const badge = item.querySelector('.badge');
        badge.textContent = task.done ? 'Hecha' : 'Pendiente';
        badge.classList.toggle('text-bg-success', Boolean(task.done));
        badge.classList.toggle('text-bg-warning', !task.done);
        const note = item.querySelector('.task-note');
        const remove = item.querySelector('.delete');
        remove.hidden = !task.done || tvMode;
        remove.addEventListener('click', () => deleteTask(task));
        if (task.done) {
          note.textContent = `Completada ${ago(task.done_at)}${task.done_by ? ` por ${task.done_by}` : ''}`;
        } else if (Date.now() - task.received_at > 86400000) {
          badge.textContent = 'Pendiente · +1 día';
          badge.classList.replace('text-bg-warning', 'text-bg-secondary');
        }
        item.dataset.id = task.id;
        list.append(item);
      }
    }

    function showError(message) {
      const alert = $('alert');
      alert.textContent = message;
      alert.classList.toggle('d-none', !message);
    }

    async function loadTasks() {
      try {
        const response = await fetch(`/api/tasks?status=${encodeURIComponent(state.status)}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        state.tasks = data.tasks;
        state.counts = data.counts;
        showError('');
        render();
      } catch {
        showError('No se pudieron cargar las tareas. Comprueba la conexión e inténtalo de nuevo.');
      }
    }

    async function updateTask(task, done) {
      try {
        const response = await fetch(`/api/tasks/${task.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ done }),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        await loadTasks();
      } catch {
        showError('No se pudo actualizar la tarea. Inténtalo otra vez.');
      }
    }

    async function deleteTask(task) {
      if (!window.confirm(`¿Eliminar la tarea #${task.id}? Esta acción no se puede deshacer.`)) return;
      try {
        const response = await fetch(`/api/tasks/${task.id}`, { method: 'DELETE' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        await loadTasks();
      } catch {
        showError('No se pudo eliminar la tarea. Inténtalo otra vez.');
      }
    }

    document.querySelectorAll('.filter').forEach((button) => {
      button.addEventListener('click', () => {
        state.status = button.dataset.status;
        document.querySelectorAll('.filter').forEach((filter) => {
          filter.classList.toggle('active', filter === button);
          filter.setAttribute('aria-pressed', String(filter === button));
        });
        loadTasks();
      });
    });
    $('search').addEventListener('input', (event) => {
      state.query = event.target.value.trim();
      render();
    });
    $('refresh').addEventListener('click', loadTasks);
    setInterval(render, 60000);
    setInterval(loadTasks, 30000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') loadTasks();
    });

    const events = new EventSource('/api/events');
    events.onopen = () => {
      $('connection').classList.add('on');
      $('connection-label').textContent = 'En directo';
      loadTasks();
    };
    events.onerror = () => {
      $('connection').classList.remove('on');
      $('connection-label').textContent = tvMode ? 'Reconectando · reintento automático' : 'Reconectando';
    };
    events.addEventListener('task:new', (event) => {
      try {
        showIncomingTask(JSON.parse(event.data));
      } catch {
        loadTasks();
      }
    });
    events.addEventListener('task:update', loadTasks);
    events.addEventListener('task:delete', loadTasks);

    loadTasks();
  </script>
</body>
</html>
