services:
  web:
    build: .
    image: whatsapp-tareas:latest
    restart: unless-stopped
    environment:
      APP_MODE: dashboard
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-whatsapp_tasks}
      MYSQL_USER: ${MYSQL_USER:-whatsapp_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}
      DEV_LIVE_RELOAD: ${DEV_LIVE_RELOAD:-true}
    volumes:
      - ./php:/var/www/html
      - /var/www/html/vendor  # <-- Preserva la carpeta vendor generada en el Dockerfile
      - ./public:/opt/whatsapp-tareas/public:ro
    depends_on:
      db:
        condition: service_healthy

  webhook:
    build: .
    image: whatsapp-tareas:latest
    restart: unless-stopped
    environment:
      APP_MODE: webhook
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-whatsapp_tasks}
      MYSQL_USER: ${MYSQL_USER:-whatsapp_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:?Configura WHATSAPP_VERIFY_TOKEN en .env}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    volumes:
      - ./php:/var/www/html
      - /var/www/html/vendor  # <-- Preserva la carpeta vendor generada en el Dockerfile
    depends_on:
      db:
        condition: service_healthy

  email-worker:
    build: .
    image: whatsapp-tareas:latest
    restart: unless-stopped
    environment:
      APP_MODE: email_worker
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-whatsapp_tasks}
      MYSQL_USER: ${MYSQL_USER:-whatsapp_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}
      GMAIL_USER: ${GMAIL_USER:?Configura GMAIL_USER en .env}
      GMAIL_PASS: ${GMAIL_PASS:?Configura GMAIL_PASS en .env}
      EXCLUDED_SENDERS_EMAIL: ${EXCLUDED_SENDERS_EMAIL:-}
      EXCLUDED_SENDERS_NAME: ${EXCLUDED_SENDERS_NAME:-}
      ALLOWED_RECIPIENTS: ${ALLOWED_RECIPIENTS:-}
      EMAIL_LOOKBACK_HOURS: ${EMAIL_LOOKBACK_HOURS:-}
    volumes:
      - ./php:/var/www/html
      - /var/www/html/vendor  # <-- Preserva la carpeta vendor generada en el Dockerfile
    command: >
      sh -c "while true; do php -f /var/www/html/fetch_emails.php; echo ''; sleep 60; done"
    depends_on:
      db:
        condition: service_healthy
  whatsapp-chrome:
    image: lscr.io/linuxserver/chromium:latest
    container_name: whatsapp_chrome
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - CUSTOM_CLI=https://web.whatsapp.com/ # Abre WhatsApp al iniciar
    volumes:
      - ./whatsapp-config:/config # Guarda la sesión para no pedir QR al reiniciar
    restart: unless-stopped
  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: docker/proxy.Dockerfile
    image: whatsapp-dashboard-proxy:latest
    restart: unless-stopped
    environment:
      PROXY_CERT_IP: ${PROXY_CERT_IP:-192.168.9.141}
      PROXY_CERT_HOSTNAME: ${PROXY_CERT_HOSTNAME:-localhost}
    volumes:
      - proxy-certificates:/etc/nginx/ssl
      - ./scripts/proxy-entrypoint.sh:/usr/local/bin/proxy-entrypoint.sh:ro
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8080}:8088"
      - "${HOST_BIND:-0.0.0.0}:${DASHBOARD_HTTPS_PORT:-8448}:8448"
      - "${WEBHOOK_HOST_BIND:-127.0.0.1}:${WEBHOOK_HOST_PORT:-8081}:8081"
      - "${WEBHOOK_HOST_BIND:-127.0.0.1}:${WEBHOOK_HTTPS_PORT:-8445}:8445"
      - "${MYSQLADMIN_HTTP_BIND:-127.0.0.1}:${MYSQLADMIN_HOST_PORT:-8082}:8082"
      - "${MYSQLADMIN_HOST_BIND:-0.0.0.0}:${MYSQLADMIN_HTTPS_PORT:-8446}:8446"
      - "${HOST_BIND:-0.0.0.0}:8083:8083"
      - "${HOST_BIND:-0.0.0.0}:8084:8084"
    depends_on:
      - web
      - webhook
      - whatsapp-chrome
      - phpmyadmin

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      MARIADB_DATABASE: ${MYSQL_DATABASE:-whatsapp_tasks}
      MARIADB_USER: ${MYSQL_USER:-whatsapp_app}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}
      MYSQLADMIN_USER: ${MYSQLADMIN_USER:?Configura MYSQLADMIN_USER en .env}
      MYSQLADMIN_PASSWORD: ${MYSQLADMIN_PASSWORD:?Configura MYSQLADMIN_PASSWORD en .env}
    volumes:
      - tareas-db:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./sql/init-phpmyadmin.sh:/docker-entrypoint-initdb.d/002-phpmyadmin-user.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

volumes:
  tareas-db:
  proxy-certificates: